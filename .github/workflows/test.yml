name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The plugin's tests/ directory is a hard requirement: losing it fails
      # the build, it never silently "passes". The glob is quoted so the
      # runner's shell (pwsh on Windows) does not try to expand it.
      - name: run tests
        shell: bash
        run: node --test "tests/*.test.js"
